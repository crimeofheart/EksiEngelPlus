name: Release

# Cut a release by pushing a v* tag from master:
#   git checkout master && git pull
#   cd frontend/app && npm run release -- patch
#   git push origin master --follow-tags
#
# One tag produces three deliverables: the Chrome zip, the Firefox zip, and the
# Android AAB + APK. There is no separate Android tag namespace — one release
# means one tag, and all four assets land on the same GitHub Release.
#
# Store submission is deliberately NOT part of this. Chrome Web Store and AMO
# uploads stay manual, and Play submission is opt-in via workflow_dispatch, so
# an extension-only fix never burns a Play review cycle on a bit-identical APK.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build"
        required: true
      submit_to_play:
        description: "Also upload the AAB to the Play internal track"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - name: Resolve ref
        id: ref
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.value }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Guards against a tag pushed from the wrong commit: the tag name and the
      # version baked into the manifests must agree, or the published assets
      # would not match the release they are attached to.
      - name: Verify tag matches package version
        id: meta
        working-directory: frontend/app
        env:
          REF: ${{ steps.ref.outputs.value }}
        run: |
          tag_version="${REF#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $REF does not match package.json version $pkg_version"
            exit 1
          fi
          echo "tag $REF matches version $pkg_version"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # Covers all seven locations, android/version.json included.
      - name: Check version consistency and manifest validity
        working-directory: frontend/app
        run: npm run check

      - name: Detect Android signing availability
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_B64 is not set — the Android artifact will be an unsigned debug build"
          fi

      - name: Play submission requires signing
        if: inputs.submit_to_play && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::Play submission was requested but no signing secrets are configured. Refusing to upload an unsigned artifact."
          exit 1

  extension:
    name: Chrome + Firefox zips
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Chrome and Firefox zips
        working-directory: frontend/app
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: frontend/publish/dist/*.zip
          if-no-files-found: error

  android:
    name: Android AAB + APK
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: needs.verify.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Signed when the secrets exist; otherwise a debug build, so that an
      # unconfigured keystore can never block an extension release. The Play
      # step above fails hard rather than ever shipping this fallback.
      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ "${{ needs.verify.outputs.signed }}" = "true" ]; then
            ./gradlew :app:bundleRelease :app:assembleRelease
          else
            echo "No signing secrets — building unsigned debug artifacts."
            ./gradlew :app:bundleDebug :app:assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          version="${{ needs.verify.outputs.version }}"
          suffix=""
          [ "${{ needs.verify.outputs.signed }}" = "true" ] || suffix="-unsigned"
          find app/build/outputs -name "*.aab" -exec cp {} "out/eksiengelplus-${version}${suffix}.aab" \;
          find app/build/outputs -name "*.apk" -exec cp {} "out/eksiengelplus-${version}${suffix}.apk" \;
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: android/out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, extension, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - run: ls -la assets

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.ref }}
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Store-ready builds for `${{ needs.verify.outputs.ref }}`.

            | Asset | Load into |
            | --- | --- |
            | `*-chrome.zip` | Chrome Web Store |
            | `*-firefox.zip` | addons.mozilla.org |
            | `*.aab` | Google Play |
            | `*.apk` | Sideload / testing |

            Both browser archives contain identical files; only `manifest.json` differs.
            All assets record the same version.

            Full user-facing changelog: [`docs/changelog.txt`](https://github.com/${{ github.repository }}/blob/${{ needs.verify.outputs.ref }}/docs/changelog.txt)

  play:
    name: Upload to Play internal track
    needs: [verify, release]
    if: inputs.submit_to_play && needs.verify.outputs.signed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-artifacts
          path: assets

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.duzgun.eksiengelplus
          releaseFiles: assets/*.aab
          track: internal
