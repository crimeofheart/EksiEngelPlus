name: Check

# Validates every deliverable on each push to master and on any PR into it.
#
# Four jobs:
#   verify     — version lockstep across all seven locations. Unfiltered: a drift
#                between frontend/app and android/ is invisible to a path filter,
#                because the drifting commit may touch only one side.
#   extension  — Chrome and Firefox zips, uploaded as two separate downloads.
#   android    — debug APK, lint, unit tests.
#   backend    — Django tests against a throwaway Postgres. Filtered on the files
#                it reads: the backend tree, plus android/version.json and
#                docs/changelog.json, which api/release_info.py turns into the
#                landing page's version and release notes.
#
# Only the three build/test jobs are path-filtered, via a `changes` job rather
# than workflow-level `paths`, so `verify` still runs when no tree is touched.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      suffix: ${{ steps.bump.outputs.suffix }}
    defaults:
      run:
        working-directory: frontend/app

    steps:
      # Full history so the PR's version can be compared against its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No install step: the extension is plain ES modules with no dependencies,
      # and scripts/ext.mjs only uses the Node standard library. Reading
      # android/version.json is a file read, so this needs no JDK either.
      - name: Check version consistency and manifest validity
        run: npm run check

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Detect version bump
        id: bump
        if: github.event_name == 'pull_request'
        env:
          # The PR's base commit, not origin/<base_ref>: a pull_request checkout
          # lands on the merge commit, where that ref does not reliably point at
          # the base branch tip.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git show "$BASE_SHA:frontend/app/package.json" > /tmp/base-package.json
          base_version="$(node -p "require('/tmp/base-package.json').version")"
          echo "base ($BASE_SHA) = $base_version | head = $VERSION"
          if [ "$base_version" = "$VERSION" ]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "### No version bump — still \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifacts below are a test build, not a release candidate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "suffix=-rc" >> "$GITHUB_OUTPUT"
            echo "### Version bump: \`$base_version\` → \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release candidate. After merging, tag \`v$VERSION\` to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  changes:
    name: Detect touched trees
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # Full history so the diff base is always reachable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Plain git rather than an action: two globs do not justify a third-party
      # dependency, and every JS action carries its own Node-runtime deprecation
      # cycle. When no base is available -- a workflow_dispatch run, a branch's
      # first push, or a force-push that orphaned the old tip -- both trees are
      # treated as touched, so the fallback is a full build, never a skipped one.
      - name: Detect touched trees
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "no usable base ('$BASE_SHA') -- building everything"
            changed=""
            all=1
          else
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            echo "$changed"
            all=0
          fi

          touched() {
            [ "$all" = 1 ] && return 0
            printf '%s\n' "$changed" | grep -qE "$1"
          }

          # This workflow defines both builds, so a change to it re-runs both.
          self='^\.github/workflows/check\.yml$'

          touched "^frontend/app/|$self" && ext=true || ext=false
          touched "^android/|$self" && droid=true || droid=false
          # api/release_info.py reads both of these, so a release or a changelog
          # edit is a backend change even when no Python moved.
          touched "^backend/|^android/version\.json$|^docs/changelog\.json$|$self" && be=true || be=false

          echo "extension=$ext | android=$droid | backend=$be"
          echo "extension=$ext" >> "$GITHUB_OUTPUT"
          echo "android=$droid" >> "$GITHUB_OUTPUT"
          echo "backend=$be" >> "$GITHUB_OUTPUT"

  extension:
    name: Chrome + Firefox zips
    needs: [verify, changes]
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Chrome and Firefox zips
        run: npm run package

      # The pre-AMO check CLAUDE.md describes, run on every build so nobody has
      # to: the packaged zip (jsdom already swapped for its stub), not the source
      # tree. Lint errors fail the job; warnings are printed and pass.
      - name: Lint the Firefox zip
        run: |
          mkdir -p "$RUNNER_TEMP/firefox-lint"
          unzip -q ../publish/dist/*-firefox.zip -d "$RUNNER_TEMP/firefox-lint"
          npx --yes web-ext@latest lint --source-dir "$RUNNER_TEMP/firefox-lint"

      # One artifact per browser, so each is a separate download.
      - name: Upload Chrome zip
        uses: actions/upload-artifact@v7
        with:
          name: eksiengelplus-${{ needs.verify.outputs.version }}${{ needs.verify.outputs.suffix }}-chrome
          path: frontend/publish/dist/*-chrome.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Firefox zip
        uses: actions/upload-artifact@v7
        with:
          name: eksiengelplus-${{ needs.verify.outputs.version }}${{ needs.verify.outputs.suffix }}-firefox
          path: frontend/publish/dist/*-firefox.zip
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Django tests
    needs: [verify, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django_EksiEngel

    # The suite runs against Postgres, not SQLite: a migration declares a
    # covering index (models.Index(..., include=...)) that SQLite cannot create,
    # and skipping migrations instead would test a schema that exists nowhere.
    # The credentials are the defaults django_EksiEngel/settings_test.py supplies.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eksiengel_test
          POSTGRES_USER: eksiengel_test
          POSTGRES_PASSWORD: eksiengel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eksiengel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Django 4.1 supports Python 3.8-3.11; the runner's default 3.12+ does not.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Covers api/test_release_info.py and api/test_update_policy.py, which the
      # store-facing pages depend on, plus the 12 other modules.
      - name: Run the suite
        run: python manage.py test --settings=django_EksiEngel.settings_test

  android:
    name: Android debug build
    needs: [verify, changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assert versionName matches the recorded version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          out="$(./gradlew printVersion --console=plain -q | tail -1)"
          echo "$out"
          case "$out" in
            "versionName=$VERSION "*) ;;
            *) echo "::error::Gradle reports '$out' but the recorded version is $VERSION"; exit 1 ;;
          esac

      # `build` covers every module's unit tests, including the pure-JVM ones that
      # assert the parser against docs/fixtures/eksisozluk/ -- selector drift is
      # caught here rather than by a user.
      - name: Build, lint and test all modules
        run: ./gradlew build lint --stacktrace

      # Instrumented Room tests need a device; not run here. connectedDebugAndroidTest
      # is executed locally against an emulator before release.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleGithubDebug

      # Room writes exported schemas into the tree. A schema change that is not
      # committed means a migration was not authored, which only surfaces as a
      # crash on a user's device. No-op until Room lands with android-foundations.
      - name: Room schema drift
        run: |
          if [ -d core/database/schemas ] && ! git diff --quiet -- core/database/schemas; then
            echo "::error::core/database/schemas is dirty after the build — commit the exported Room schema"
            git --no-pager diff -- core/database/schemas
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: eksiengelplus-${{ needs.verify.outputs.version }}${{ needs.verify.outputs.suffix }}-android-debug
          path: android/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
