name: Extension release

# Cut a release by pushing a v* tag from master:
#   git checkout master && git pull
#   cd frontend/app && npm run release -- patch
#   git push origin master --follow-tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Guards against a tag pushed from the wrong commit: the tag name and the
      # version baked into the manifests must agree, or the published zips would
      # not match the release they are attached to.
      - name: Verify tag matches package version
        working-directory: frontend/app
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $pkg_version"

      - name: Check version consistency and manifest validity
        working-directory: frontend/app
        run: npm run check

      - name: Build Chrome and Firefox zips
        working-directory: frontend/app
        run: npm run package

      - uses: softprops/action-gh-release@v3
        with:
          files: frontend/publish/dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Store-ready builds for `${{ github.ref_name }}`.

            | Asset | Load into |
            | --- | --- |
            | `*-chrome.zip` | Chrome Web Store |
            | `*-firefox.zip` | addons.mozilla.org |

            Both archives contain identical files; only `manifest.json` differs.

            Full user-facing changelog: [`docs/changelog.txt`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/changelog.txt)
