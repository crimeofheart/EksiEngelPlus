name: Release

# Cut a release by pushing a v* tag from master:
#   cd frontend/app && npm run release -- patch
#   git push origin master --follow-tags
#   tools/build-release.sh --upload-apk
#
# Nothing is built or attached here. The Chrome and Firefox zips, the AAB and the
# APK are built and signed on the maintainer's machine (tools/build-release.sh),
# so the upload key never leaves it, and uploaded to the stores by hand. The APK
# for sideloading is served from eksiengelplus.duzgun.org/download/, not from
# GitHub. This workflow only checks the tag and opens a GitHub Release with the
# notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify tag and publish notes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Guards against a tag pushed from the wrong commit: the tag name and the
      # version recorded in the seven places must agree.
      - name: Verify tag matches package version
        working-directory: frontend/app
        env:
          REF: ${{ github.ref_name }}
        run: |
          tag_version="${REF#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $REF does not match package.json version $pkg_version"
            exit 1
          fi
          echo "tag $REF matches version $pkg_version"

      - name: Check version consistency and manifest validity
        working-directory: frontend/app
        run: npm run check

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Release `${{ github.ref_name }}`. Builds are made locally and published to the stores; nothing is attached here.

            | Platform | Install from |
            | --- | --- |
            | Chrome | [Chrome Web Store](https://chromewebstore.google.com/detail/eksiengelplus/cakplcekfmnpelnchanlpoieoiodepdh) |
            | Firefox (desktop and Android) | [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/eksiengelplus) |
            | Android app | [APK](https://eksiengelplus.duzgun.org/download/eksiengelplus.apk) — newest build |

            Full user-facing changelog: [`frontend/app/assets/js/changelog.js`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/frontend/app/assets/js/changelog.js). Pre-rename releases (1.0.0–3.2.0) are in [`docs/changelog.legacy.json`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/changelog.legacy.json).
