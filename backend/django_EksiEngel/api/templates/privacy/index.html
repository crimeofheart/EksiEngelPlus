<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gizlilik Politikası - EksiEngelPlus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo img {
            width: 64px;
            height: 64px;
        }
        .logo h1 {
            font-size: 2rem;
            color: #2E7D32;
        }
        .logo h1 span {
            color: #4CAF50;
        }
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lang-btn {
            padding: 8px 16px;
            border: 2px solid #4CAF50;
            background: white;
            color: #4CAF50;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: #4CAF50;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .card h2 {
            color: #2E7D32;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #4CAF50;
        }
        .card h3 {
            color: #4CAF50;
            margin: 25px 0 10px 0;
        }
        .card p, .card ul {
            color: #555;
            margin-bottom: 15px;
        }
        .card ul {
            margin-left: 20px;
        }
        .card li {
            margin-bottom: 8px;
        }
        .card a {
            color: #4CAF50;
            text-decoration: none;
        }
        .card a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: white;
        }
        footer a {
            color: white;
            text-decoration: underline;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2E7D32;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            border-radius: 20px;
        }
        .back-link:hover {
            background: #2E7D32;
            color: white;
        }
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span data-tr="Ana Sayfaya Dön" data-en="Back to Home"></span>
        </a>

        <header>
            <div class="logo">
                <img src="https://raw.githubusercontent.com/crimeofheart/EksiEngelPlus/master/frontend/app/assets/img/eksiengel128.png" alt="EksiEngelPlus">
                <h1>Eksi<span>Engel</span>Plus</h1>
            </div>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLanguage('tr')">Türkçe</button>
                <button class="lang-btn" onclick="setLanguage('en')">English</button>
            </div>
        </header>

        <section class="card">
            <h2 data-tr="Gizlilik Politikası" data-en="Privacy Policy"></h2>
            
            <p data-tr="EksiEngelPlus olarak, gizliliğiniz bizim için önemlidir. Bu gizlilik politikası, eklentinin nasıl çalıştığı ve verilerinizi nasıl işlediği hakkında sizi bilgilendirmek amacıyla hazırlanmıştır." data-en="At EksiEngelPlus, your privacy is important to us. This privacy policy is designed to inform you about how the extension works and processes your data."></p>

            <h3 data-tr="Cihazınızda Tutulanlar" data-en="Kept on Your Device"></h3>
            <p data-tr="Eklenti ve Android uygulaması şunları cihazınızda saklar:" data-en="The extension and the Android app keep the following on your device:"></p>
            <ul>
                <li data-tr="Engellediğiniz, sessize aldığınız ve takip ettiğiniz yazarların listeleri" data-en="Lists of the authors you block, mute and follow"></li>
                <li data-tr="Ayarlarınız ve tercihleriniz" data-en="Your settings and preferences"></li>
                <li data-tr="Kuyruk ve son işlemlerin kaydı" data-en="The queue and a record of recent operations"></li>
            </ul>

            <h3 data-tr="Sunucuya Gönderilenler" data-en="Sent to Our Server"></h3>
            <p data-tr="Aşağıdakiler yalnızca EksiEngelPlus'ın kendi sunucusuna (eksiengelplus.duzgun.org) gönderilir. İki ayrı ayar vardır; ikisi de varsayılan olarak <strong>AÇIK</strong>tır ve ikisi de ayarlardan birbirinden bağımsız olarak <strong>KAPATILABİLİR</strong>." data-en="The following is sent only to EksiEngelPlus's own server (eksiengelplus.duzgun.org). There are two separate settings; both are <strong>ON</strong> by default, and each can be <strong>TURNED OFF</strong> in the settings independently of the other."></p>
            <p data-tr="<strong>İşlem geçmişi ve eşitleme</strong> (“İşlem geçmişimi sunucuda sakla ve cihazlarım arasında eşitle”):" data-en="<strong>Operation history and sync</strong> (“Keep my operation history on the server and sync it across my devices”):"></p>
            <ul>
                <li data-tr="Her engelleme, sessize alma, başlık engelleme ve takip işleminin sonucu: Ekşi Sözlük kullanıcı adınız ve numaranız, işlemin hedefi olan yazarın kullanıcı adı ve numarası, işlemin türü, sonucu ve zamanı" data-en="The outcome of every block, mute, title-block and follow: your Ekşi Sözlük username and id, the username and id of the author it targeted, the kind of action, its result and its time"></li>
                <li data-tr="Kuyruktaki işlemler ve durumları, böylece aynı kişinin eklenti kurulumları ve uygulaması tek bir kuyruk görür" data-en="Queued operations and their status, so one person's extension installs and app see a single queue"></li>
                <li data-tr="Her cihaz için rastgele bir cihaz anahtarı; sunucu yalnızca bu anahtarın özetini saklar. Bir cihaz yalnızca kendi hesabının gönderdiklerini görebilir." data-en="A random key per device; the server keeps only a hash of it. A device can see only what its own account sent."></li>
            </ul>
            <p data-tr="<strong>Toplanan verileri gönder</strong> (kullanım verisi):" data-en="<strong>Send collected data</strong> (usage data):"></p>
            <ul>
                <li data-tr="Her işlem bitince bir işlem raporu: Ekşi Sözlük kullanıcı adınız ve numaranız, işlemin türü, sayıları, eklenti sürümü ve ayarlarınız; günlük kaydı gönderimi açıksa hata ayıklama günlüğü" data-en="A report when each operation finishes: your Ekşi Sözlük username and id, the kind of operation, its counts, the version and your settings; and, if log sending is on, a debug log"></li>
                <li data-tr="İşlem geçmişi eşitlemesi kapalıyken bu rapor, işlemin hedefi olan yazarların kullanıcı adlarını ve numaralarını da içerir; açıkken yalnızca sayıları içerir" data-en="While history sync is off, this report also lists the usernames and ids of the authors the operation targeted; while it is on, it carries only their count"></li>
                <li data-tr="Eklentide hangi düğmelerin kullanıldığına dair sayılar" data-en="Counts of which buttons in the extension are used"></li>
            </ul>
            <p data-tr="Gönderilen kullanıcı adları kişisel veri sayılabilir; bu veriler anonim değildir." data-en="Usernames that are sent can count as personal data; this data is not anonymous."></p>

            <h3 data-tr="Veri Kullanımı" data-en="Data Usage"></h3>
            <p data-tr="Sunucudaki veriler yalnızca şunlar için kullanılır:" data-en="Data on the server is used only to:"></p>
            <ul>
                <li data-tr="Kuyruğunuzu ve işlem geçmişinizi cihazlarınız arasında eşitlemek" data-en="Sync your queue and operation history across your devices"></li>
                <li data-tr="En çok engellenen ve sessize alınan yazarlar gibi toplu istatistikler çıkarmak" data-en="Produce aggregate statistics, such as the most blocked and most muted authors"></li>
                <li data-tr="Hataları bulmak ve eklentiyi geliştirmek" data-en="Find bugs and improve the extension"></li>
            </ul>
            <p data-tr="İstatistiklere ve tek bir kişinin geçmişine yalnızca proje yöneticisi erişebilir. Bir kişinin geçmişine yapılan her bakış, kimin ve ne zaman baktığıyla birlikte kayda geçer. Veriler satılmaz ve herkese açık yayınlanmaz." data-en="Only the project maintainer can access the statistics and any one person's history. Every look at one person's history is logged with who looked and when. The data is not sold and is not published."></p>

            <h3 data-tr="Saklama ve Silme" data-en="Retention and Deletion"></h3>
            <ul>
                <li data-tr="Eşitlenen işlem geçmişi, siz silene kadar saklanır." data-en="Synced operation history is kept until you delete it."></li>
                <li data-tr="Ayarlardaki “Sunucudaki verilerimi sil” düğmesi, cihazlarınızın eşitlediği geçmişi ve kuyruğu sunucudan kalıcı olarak siler ve eşitlemeyi kapatır. Eşitlemeyi yalnızca kapatmak, sunucudaki verileri silmez." data-en="The “Delete my data on the server” button in the settings permanently deletes the history and queue your devices synced and turns sync off. Only turning sync off does not delete anything on the server."></li>
                <li data-tr="“Toplanan verileri gönder” ile gönderilen işlem raporları bir cihaza bağlı olmadığından bu düğme onları silmez; silinmelerini istiyorsanız GitHub üzerinden bize yazın." data-en="Operation reports sent with “Send collected data” are not tied to a device, so that button does not delete them; to have them deleted, contact us via GitHub."></li>
            </ul>

            <h3 data-tr="Veri Paylaşımı" data-en="Data Sharing"></h3>
            <p data-tr="EksiEngelPlus, verilerinizi üçüncü taraflarla PAYLAŞMAZ. Hiçbir reklamcılık ağı, analiz servisi veya başka bir üçüncü taraf bu eklenti aracılığıyla veri toplamaz." data-en="EksiEngelPlus does NOT share your data with third parties. No advertising network, analytics service or other third party collects data through this extension."></p>

            <h3 data-tr="Üçüncü Taraf Bağlantıları" data-en="Third-Party Links"></h3>
            <p data-tr="Bu eklenti, Ekşi Sözlük web sitesi ile etkileşim halindedir. Ekşi Sözlük'ün gizlilik politikası bu eklentiden bağımsızdır ve bizim kontrolümüzde değildir." data-en="This extension interacts with the Ekşi Sözlük website. Ekşi Sözlük's privacy policy is independent of this extension and is not under our control."></p>

            <h3 data-tr="Çerezler" data-en="Cookies"></h3>
            <p data-tr="EksiEngelPlus kendi çerezini kullanmaz. Ekşi Sözlük'teki işlemler, sizin Ekşi Sözlük oturumunuzla yapılır; bu oturum bilgileri hiçbir zaman bizim sunucumuza gönderilmez." data-en="EksiEngelPlus sets no cookies of its own. Operations on Ekşi Sözlük are carried out with your own Ekşi Sözlük session, and that session is never sent to our server."></p>

            <h3 data-tr="Güvenlik" data-en="Security"></h3>
            <p data-tr="Sunucuyla iletişim şifreli (HTTPS) bağlantı üzerinden yapılır. Cihaz anahtarları sunucuda yalnızca özet olarak tutulur ve bir cihaz başka bir hesabın verisini okuyamaz." data-en="Communication with the server uses an encrypted (HTTPS) connection. Device keys are kept on the server only as hashes, and a device cannot read another account's data."></p>

            <h3 data-tr="Değişiklikler" data-en="Changes"></h3>
            <p data-tr="Bu gizlilik politikası zaman zaman güncellenebilir. Önemli değişiklikler olması durumunda eklenti açıklamasında veya sitemizde bilgi verilecektir." data-en="This privacy policy may be updated from time to time. In case of significant changes, information will be provided in the extension description or on our website."></p>

            <h3 data-tr="İletişim" data-en="Contact"></h3>
            <p data-tr="Bu gizlilik politikası hakkında herhangi bir sorunuz varsa, lütfen GitHub üzerinden bizimle iletişime geçin:" data-en="If you have any questions about this privacy policy, please contact us via GitHub:"></p>
            <p><a href="https://github.com/crimeofheart/EksiEngelPlus" target="_blank">github.com/crimeofheart/EksiEngelPlus</a></p>

            <h3 data-tr="Son Güncelleme" data-en="Last Updated"></h3>
            <p data-tr="Bu gizlilik politikası en son Ekim 2026'da güncellenmiştir." data-en="This privacy policy was last updated in October 2026."></p>
        </section>

        <footer>
            <p data-tr="© 2026 EksiEngelPlus. Tüm hakları saklıdır." data-en="© 2026 EksiEngelPlus. All rights reserved."></p>
            <p data-tr="Bu eklenti Ekşi Sözlük ile bağlantılı değildir." data-en="This extension is not affiliated with Ekşi Sözlük."></p>
        </footer>
    </div>

    <script>
        function setLanguage(lang) {
            document.querySelectorAll('[data-tr]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + lang);
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            document.documentElement.lang = lang;
            localStorage.setItem('preferred_language', lang);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('preferred_language') || 'tr';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
